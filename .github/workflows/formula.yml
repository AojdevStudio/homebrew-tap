name: Formula CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: brew style Formula/claudex.rb
      - run: brew audit --strict --online --formula Formula/claudex.rb
      - run: brew install --formula Formula/claudex.rb
      - run: brew test claudex
      - run: brew uninstall claudex
